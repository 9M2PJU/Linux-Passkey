name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-cryptography python3-pytest python3-pyflakes \
            gir1.2-glib-2.0 dbus desktop-file-utils appstream libxml2-utils polkitd
          sudo pip3 install --break-system-packages "fido2>=2"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: make lint
      - name: Test
        run: make check

  package:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debhelper dh-python python3-all zip gettext lintian \
            python3-gi python3-cryptography python3-pytest
      - name: Build Debian packages
        run: |
          make deb
          lintian --fail-on warning ../*.deb
          mkdir -p dist && mv ../*.deb dist/
      - name: Build GNOME Shell extension
        run: make extension-zip
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-passkey
          path: dist/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-passkey
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
